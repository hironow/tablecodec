name: CI

# Note: matrix.* and github.ref/github.workflow are trusted, non-attacker-controlled.
# No usage of github.event.{issue,pull_request,comment,review}.* in any run: step.
# Actions are pinned to full commit SHAs (repo policy: sha_pinning_required).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate below is `just`, so the justfile recipes are the single
      # definition of what lint/type/test cover -- CI cannot drift to a
      # narrower path set than the local gate. Two tools the recipes reach
      # for are installed here: `just` itself, and mise, which supplies the
      # pinned markdownlint-cli2 that `just lint` runs over tracked markdown.
      #
      # mise goes in BEFORE setup-uv on purpose: each action prepends to PATH,
      # so installing uv last keeps the pinned 0.11.17 ahead of anything mise
      # might shim.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install mise-pinned tools (markdownlint-cli2, prek)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for
          # the `uv sync --locked` guard to be reliable (lock revision is
          # uv-version-tied).
          version: "0.11.17"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Tool versions
        run: |
          just --version
          uv --version
          mise --version

      # --locked fails if uv.lock drifts from pyproject.toml (e.g. a version
      # bump that forgot to sync the lock), catching it before a release tag.
      - name: Install (locked; dev + cli + teds extras)
        run: uv sync --locked --group lint --extra dev --extra cli --extra teds

      # ruff check + ruff format --check over src/ tests/ scripts/, plus
      # markdownlint over tracked markdown. The paths live in the justfile.
      - name: Lint
        run: just lint

      - name: Type check (ty)
        run: just type

      - name: Unit tests
        run: just test

      # Regenerate the codec-derived docs and fail if they drift from what is
      # committed. Run once on a single matrix leg; the result is platform- and
      # version-independent.
      - name: Docs up to date (generated tables)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: just docs-check

  semgrep:
    name: semgrep (rules + core scan)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          enable-cache: true

      # Pinned on purpose. semgrep gates merges, so an unpinned upgrade can
      # fail CI on code nobody touched -- a new or widened rule turns green
      # into red with no commit behind it. Dependabot does not track this
      # version: semgrep is neither a workflow action nor a project dependency,
      # so raising it is always a deliberate edit here.
      #
      # When raising it, pick a version available on PyPI and
      # that is older than the seven-day `exclude-newer` window the project
      # applies elsewhere. 1.176.0 satisfied neither when this was written.
      - name: Install semgrep
        run: uv tool install semgrep==1.175.0

      - name: Test semgrep rules (rule correctness, not real code)
        run: just semgrep-test

      - name: Scan source with semgrep meta-rules
        run: just semgrep

  pip-install-check:
    name: pip install -e .
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install (no extras) — verifies core stays stdlib-only at import time
        run: just core-install-check

  docling:
    name: docling bridge
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.11"
          enable-cache: true
      - run: just bridge-lock-check docling-ci

  packages:
    name: build core and bridge
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.11"
          enable-cache: true
      - run: just build-check
