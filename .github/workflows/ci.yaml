name: CI

# Note: matrix.* and github.ref/github.workflow are trusted, non-attacker-controlled.
# No usage of github.event.{issue,pull_request,comment,review}.* in any run: step.
# Actions are pinned to full commit SHAs (repo policy: sha_pinning_required).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate below is `just`, so the justfile recipes are the single
      # definition of what lint/type/test cover -- CI cannot drift to a
      # narrower path set than the local gate. Two tools the recipes reach
      # for are installed here: `just` itself, and mise, which supplies the
      # pinned markdownlint-cli2 that `just lint` runs over tracked markdown.
      #
      # mise goes in BEFORE setup-uv on purpose: each action prepends to PATH,
      # so installing uv last keeps the pinned 0.11.17 ahead of anything mise
      # might shim.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install mise-pinned tools (markdownlint-cli2, prek)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin uv so CI resolves uv.lock identically to local -- required for
          # the `uv sync --locked` guard to be reliable (lock revision is
          # uv-version-tied).
          version: "0.11.17"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Tool versions
        run: |
          just --version
          uv --version
          mise --version

      # Route PyPI installs through Takumi Guard (blocks known-malicious
      # packages before they execute; sets UV_INDEX_URL/PIP_INDEX_URL to the
      # screened registry for this job). Blocking-only mode, no account needed.
      # Must precede any uv/pip install.
      - name: Route installs through Takumi Guard
        uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0

      # --locked fails if uv.lock drifts from pyproject.toml (e.g. a version
      # bump that forgot to sync the lock), catching it before a release tag.
      - name: Install (locked; dev + cli + teds extras)
        run: uv sync --locked --extra dev --extra cli --extra teds

      # ruff check + ruff format --check over src/ tests/ scripts/, plus
      # markdownlint over tracked markdown. The paths live in the justfile.
      - name: Lint
        run: just lint

      - name: Type check (pyright strict)
        run: just type

      - name: Unit tests
        run: just test

      # Regenerate the codec-derived docs and fail if they drift from what is
      # committed. Run once on a single matrix leg; the result is platform- and
      # version-independent.
      - name: Docs up to date (generated tables)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: just docs-check

  semgrep:
    name: semgrep (rules + core scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install semgrep
        run: pipx install semgrep

      - name: Test semgrep rules (rule correctness, not real code)
        run: just semgrep-test

      - name: Scan source with semgrep meta-rules
        run: just semgrep

  pip-install-check:
    name: pip install -e .
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install (no extras) — verifies core stays stdlib-only at import time
        run: |
          python -m venv .venv-check
          .venv-check/bin/python -m pip install --upgrade pip
          .venv-check/bin/python -m pip install -e .
          .venv-check/bin/python -c "import tablecodec; print(tablecodec.__version__)"
