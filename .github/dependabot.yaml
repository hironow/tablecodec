# Dependabot version updates (first-party; no third-party app with repo write
# access). Dependabot security updates are enabled separately in the repo's
# security settings.
#
# Supply-chain hardening: a 7-day `cooldown` holds back every routine bump until
# the new version has been public for a week, so a compromised-then-yanked
# release is not pulled in on day zero. Cooldown applies to version updates only
# -- Dependabot SECURITY updates (vulnerability fixes) bypass it and still land
# fast.
#
# NOTE on the uv ecosystem: pyproject.toml sets `[tool.uv] exclude-newer` to the
# relative window `"7 days"` (ADR 0015), so a Dependabot uv pull request now
# resolves without anyone editing a date first. Both delays are seven days on
# purpose -- see the comment on the uv `cooldown` below. Dependabot resolves
# through the same screened index CI uses -- see `registries` below.
#
# Ecosystems in this repo:
#   github-actions  -> .github/workflows/*.yaml (SHA-pinned actions)
#   uv              -> pyproject.toml + uv.lock (dev/cli/teds/hf extras only;
#                      the runtime core is zero-dependency)
version: 2

# Registries Dependabot is allowed to reach. It talks to nothing that is not
# declared here, so without this block its uv runs resolve against pypi.org and
# rewrite every `source = { registry = ... }` line in uv.lock to that URL. CI
# then injects the screened index through UV_INDEX_URL, and `uv sync --locked`
# fails with "The lockfile at `uv.lock` needs to be updated". That is exactly
# what happened to the first batch of uv pull requests after the updater came
# back (all 64 registry lines flipped to pypi.org).
#
# The URL has to match `registry = "https://pypi.flatt.tech/simple/"` in uv.lock
# character for character, trailing slash included; a mismatch reproduces the
# same failure. No credentials appear here because Takumi Guard's blocking-only
# mode is unauthenticated, so nothing reaches into repository secrets.
registries:
  takumi-guard-pypi:
    type: python-index
    url: https://pypi.flatt.tech/simple/
    # Resolve through the screened index instead of pypi.org, matching what
    # flatt-security/setup-takumi-guard-pypi does for every CI and release job.
    replaces-base: true

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Resolve through the screened index declared above rather than pypi.org,
    # so the lockfile a Dependabot pull request produces is the one CI verifies
    # with `uv sync --locked`.
    registries: "*"
    # Seven days here is the same seven days as `[tool.uv] exclude-newer =
    # "7 days"` in pyproject.toml (ADR 0015). Dependabot waits a week before
    # proposing a version; uv refuses to resolve anything younger than a week.
    # Change them together. If uv's window ever ends up the longer of the two,
    # Dependabot proposes versions uv cannot resolve and the updater fails
    # outright rather than degrading -- which is what the old absolute cutoff
    # did to every uv run from 2026-07-22 until ADR 0015.
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore"
      include: "scope"
