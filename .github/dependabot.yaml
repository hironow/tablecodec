# Dependabot version updates (first-party; no third-party app with repo write
# access). Dependabot security updates are enabled separately in the repo's
# security settings.
#
# Supply-chain hardening: a 7-day `cooldown` holds back every routine bump until
# the new version has been public for a week, so a compromised-then-yanked
# release is not pulled in on day zero. Cooldown applies to version updates only
# -- Dependabot SECURITY updates (vulnerability fixes) bypass it and still land
# fast.
#
# NOTE on the uv ecosystem: pyproject.toml sets `[tool.uv] exclude-newer` to the
# relative window `"7 days"` (ADR 0015), so a Dependabot uv pull request now
# resolves without anyone editing a date first. Both delays are seven days on
# purpose -- see the comment on the uv `cooldown` below. Dependabot resolves
# through the same official PyPI registry CI uses.
#
# Ecosystems in this repo:
#   github-actions  -> .github/workflows/*.yaml (SHA-pinned actions)
#   uv              -> pyproject.toml + uv.lock (dev/cli/teds/hf extras only;
#                      the runtime core is zero-dependency)
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "15:01"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: "uv"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    # Seven days here is the same seven days as `[tool.uv] exclude-newer =
    # "7 days"` in pyproject.toml (ADR 0015). Dependabot waits a week before
    # proposing a version; uv refuses to resolve anything younger than a week.
    # Change them together. If uv's window ever ends up the longer of the two,
    # Dependabot proposes versions uv cannot resolve and the updater fails
    # outright rather than degrading -- which is what the old absolute cutoff
    # did to every uv run from 2026-07-22 until ADR 0015.
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
